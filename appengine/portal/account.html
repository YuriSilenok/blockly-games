<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Учётная запись — Пруд</title><link rel="stylesheet" href="style.css"><script src="api.js"></script><script defer src="account.js"></script><nav><a href="../index.html">Пруд</a><a href="../pond-tutor.html">Обучение</a><a href="tournament.html">Турниры</a></nav><main><h1>Учётная запись</h1><p id="status" class="status" role="status"></p><div id="auth" class="grid" hidden><form id="login" class="card"><h2>Вход</h2><label>Логин<input name="login" autocomplete="username" required minlength="3" maxlength="40"></label><label>Пароль<input name="password" type="password" autocomplete="current-password" required minlength="8"></label><button>Войти</button></form><form id="register" class="card"><h2>Регистрация ученика</h2><p>Прогресс и команда будут доступны на разных устройствах.</p><label>Логин латинскими буквами<input name="login" autocomplete="username" required pattern="[a-zA-Z0-9_.-]{3,40}"></label><label>Пароль от 8 символов<input name="password" type="password" autocomplete="new-password" required minlength="8"></label><button>Создать учётную запись</button></form></div><section id="profile" class="card" hidden><h2 id="name"></h2><p id="progress"></p><form id="team"><label>Название команды<input name="team" required minlength="2" maxlength="60"></label><button>Сохранить название</button></form><p><a class="button" href="../pond-tutor.html">Продолжить обучение</a> <a id="admin" href="admin.html" hidden>Администрирование</a></p><button id="logout" class="secondary">Выйти</button></section></main></html>
